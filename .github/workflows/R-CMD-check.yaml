# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check-terms:
    runs-on: atmos-aws-arc-runner-set
    container:
      image: docker-innersource-remote.artifactory.sanofi.com/r:4.4
    steps:
      - name: Setup the Sanofi Root CA
        uses: Sanofi-InnerSource/github-actions-library/setup-root-ca@main       
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan code
        run: Rscript inst/tools/terms_scanner.R
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: terms-scanner
          path: scan-results.csv
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    if: >
      !(
        (github.event_name == 'push' &&
          contains(toJson(github.event.commits.*.message), '[skip r-cmd-check]')) ||
        (github.event_name == 'pull_request' &&
          (contains(github.event.pull_request.title, '[skip r-cmd-check]') ||
           contains(github.event.pull_request.body,  '[skip r-cmd-check]')))
      )
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check
      
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
